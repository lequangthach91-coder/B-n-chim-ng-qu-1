name: Build Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy game
        shell: bash
        run: |
          mkdir -p windows/www
          cp www/index.html windows/www/index.html
      - name: Build installer
        working-directory: windows
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: banchim-windows
          path: windows/dist/*.exe
